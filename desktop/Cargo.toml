license.workspace = true

[[bin]]
name = "trace-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
trace-gateway-cli = { path = "../crates/trace-cli" }
